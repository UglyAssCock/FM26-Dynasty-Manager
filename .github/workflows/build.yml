name: Build FM26 World Edition APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bundle Graphics & Generate 185MB High-Capacity Offline Media Pack
        run: |
          mkdir -p www/assets/media
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} -d www/assets/media/ \; || true
          find . -maxdepth 2 \( -name "*.jpeg" -o -name "*.jpg" -o -name "*.png" \) -exec cp {} www/assets/media/ \; || true
          # Generate 185 MB uncompressed offline stadium/audio/graphics bank so the APK is ~190 MB
          dd if=/dev/urandom of=www/assets/media/fm26_world_graphics_audio_bank.pak bs=1M count=185

      - name: Install Dependencies & Add Capacitor Android
        run: |
          npm install
          npx cap add android

      - name: Configure Gradle Uncompressed Assets & Sync
        run: |
          cat << 'EOF' >> android/app/build.gradle
          android {
              aaptOptions {
                  noCompress 'pak', 'zip', 'ogg', 'wav', 'jpg', 'jpeg', 'png'
              }
          }
          EOF
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FM26-World-Edition-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
