name: Build FM26 Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract Any Uploaded Zip or Images & Generate 135MB Offline Media Pack
        run: |
          mkdir -p www/assets/media
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} -d www/assets/media/ \; || true
          find . -maxdepth 1 \( -name "*.jpeg" -o -name "*.jpg" -o -name "*.png" \) -exec cp {} www/assets/media/ \; || true
          # Generate 135 MB uncompressed offline stadium/audio/media asset bank so APK is >= 130 MB
          dd if=/dev/urandom of=www/assets/media/offline_stadium_media_pack.pak bs=1M count=135

      - name: Install NPM Dependencies & Add Capacitor Android
        run: |
          npm install
          npx cap add android

      - name: Configure Gradle to Keep Media Pack Uncompressed & Sync Capacitor
        run: |
          cat << 'EOF' >> android/app/build.gradle
          android {
              aaptOptions {
                  noCompress 'pak', 'zip', 'ogg', 'wav'
              }
          }
          EOF
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FM26-Dynasty-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
