<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FM Dynasty Manager</title>
  <style>
    :root {
      --bg: #080c14;
      --card: #111827;
      --card-alt: #1e293b;
      --border: #2dd4bf33;
      --accent: #10b981;
      --accent-2: #3b82f6;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .hdr-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.4px;
    }
    .hdr-sub {
      font-size: 11px;
      color: var(--muted);
    }
    .hdr-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    #sub-tabs {
      background: #0b111e;
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }
    #sub-tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-chip {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid #1e293b;
      cursor: pointer;
    }
    .tab-chip.active {
      background: var(--accent);
      color: #04130d;
      border-color: var(--accent);
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      padding-bottom: 84px;
    }
    .card {
      background: var(--card);
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-box {
      background: var(--card-alt);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .stat-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }
    .stat-lbl {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }
    .btn {
      background: var(--accent);
      color: #03150e;
      border: none;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-sec {
      background: var(--card-alt);
      color: var(--text);
      border: 1px solid #334155;
    }
    .btn-blue {
      background: var(--accent-2);
      color: #fff;
    }
    .btn-warn {
      background: var(--warn);
      color: #111;
    }
    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-block {
      width: 100%;
      margin-top: 6px;
    }
    input, select, textarea {
      width: 100%;
      background: #0b1322;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    label {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-bottom: 3px;
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 7px 5px;
      text-align: left;
      border-bottom: 1px solid #1e293b;
    }
    th {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      background: var(--card-alt);
      color: var(--accent);
    }
    .pos-GK { color: #facc15; }
    .pos-DEF { color: #38bdf8; }
    .pos-MID { color: #4ade80; }
    .pos-FWD { color: #f87171; }
    .pitch {
      background: #0d4a29;
      border: 2px solid #ffffff55;
      border-radius: 12px;
      height: 300px;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .pitch-line-mid {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 1px solid #ffffff44;
    }
    .pitch-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 64px;
      height: 64px;
      border: 1px solid #ffffff44;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .pitch-node {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #091326;
      border: 2px solid var(--accent);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
    }
    .pitch-ball {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border: 2px solid #000;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.25s linear;
    }
    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--card);
      border-top: 1px solid #1f2937;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      padding: 6px 2px;
      cursor: pointer;
    }
    .nav-item.active {
      color: var(--accent);
    }
    .nav-icon {
      font-size: 16px;
      display: block;
      margin-bottom: 2px;
    }
    .crest-2d {
      width: 32px;
      height: 32px;
      display: inline-block;
      vertical-align: middle;
      box-shadow: none !important;
      filter: none !important;
    }
    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #090d16;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <header id="app-header">
    <div>
      <div class="hdr-title" id="hdr-club">FM DYNASTY 26</div>
      <div class="hdr-sub" id="hdr-date">Offline Edition • Ready</div>
    </div>
    <div class="hdr-actions" id="hdr-btns"></div>
  </header>

  <div id="sub-tabs"></div>

  <main id="app-view"></main>

  <nav id="bottom-nav"></nav>

  <input type="file" id="hidden-file-input" style="display:none" />
  <script src="app.js"></script>
</body>
</html>
